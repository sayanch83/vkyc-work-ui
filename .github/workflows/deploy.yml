name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil
        run: npm run build

      - name: Show build output
        run: ls -la www/ || echo "www/ not found"

      - name: Inject API URL into built HTML
        run: |
          API_URL="${{ secrets.VKYC_API_BASE }}"
          if [ -z "$API_URL" ]; then
            echo "No VKYC_API_BASE secret set, using localhost fallback"
          else
            find . -name "index.html" -path "*/www/*" -exec \
              sed -i "s|http://localhost:3001/api/v1|${API_URL}|g" {} \;
            echo "Injected API URL: ${API_URL}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4