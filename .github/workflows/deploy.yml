name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil
        run: npm run build
        env:
          # Point UI at your deployed API — set this in GitHub repo secrets
          VKYC_API_BASE: ${{ secrets.VKYC_API_BASE || 'http://localhost:3001/api/v1' }}

      - name: Inject API base URL into built HTML
        run: |
          API_URL="${{ secrets.VKYC_API_BASE || 'http://localhost:3001/api/v1' }}"
          # Inject window.__VKYC_API__ before </head> in the built index.html
          sed -i "s|</head>|<script>window.__VKYC_API__='${API_URL}';</script></head>|" www/index.html
          echo "API URL injected: ${API_URL}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
